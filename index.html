<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学工具箱 - Math Toolbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-animation"></div>
    <div class="app-container">
        <main class="main-content">
            <header class="top-bar">
                <button class="btn btn-link menu-toggle" id="menuToggle">
                    <i class="bi bi-list"></i> <span data-i18n="menu">菜单</span>
                </button>
                <div class="current-module" id="currentModule">
                    <h1 data-i18n="calculator">科学计算器</h1>
                </div>
                <div class="top-bar-actions">
                    <div class="language-selector">
                        <select id="languageSelect" class="form-select form-select-sm">
                            <option value="zh">中文</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                </div>
            </header>

            <div class="content-area" id="contentArea">
                <div class="module-container active" id="module-calculator">
                    <div class="card calculator-card">
                        <div class="card-body">
                            <div class="calculator-display">
                                <input type="text" id="calcDisplay" class="form-control" readonly>
                                <div class="calc-history" id="calcHistory"></div>
                            </div>
                            <div class="calculator-buttons">
                                <div class="btn-group-vertical w-100">
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-secondary" data-action="clear">C</button>
                                        <button type="button" class="btn btn-secondary" data-action="backspace">⌫</button>
                                        <button type="button" class="btn btn-secondary" data-action="percent">%</button>
                                        <button type="button" class="btn btn-warning" data-action="divide">÷</button>
                                    </div>
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-light" data-action="7">7</button>
                                        <button type="button" class="btn btn-light" data-action="8">8</button>
                                        <button type="button" class="btn btn-light" data-action="9">9</button>
                                        <button type="button" class="btn btn-warning" data-action="multiply">×</button>
                                    </div>
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-light" data-action="4">4</button>
                                        <button type="button" class="btn btn-light" data-action="5">5</button>
                                        <button type="button" class="btn btn-light" data-action="6">6</button>
                                        <button type="button" class="btn btn-warning" data-action="subtract">−</button>
                                    </div>
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-light" data-action="1">1</button>
                                        <button type="button" class="btn btn-light" data-action="2">2</button>
                                        <button type="button" class="btn btn-light" data-action="3">3</button>
                                        <button type="button" class="btn btn-warning" data-action="add">+</button>
                                    </div>
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-light" data-action="0">0</button>
                                        <button type="button" class="btn btn-light" data-action="dot">.</button>
                                        <button type="button" class="btn btn-danger" data-action="equals">=</button>
                                    </div>
                                </div>
                                <div class="scientific-buttons mt-3">
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-outline-primary btn-sm" data-action="sin">sin</button>
                                        <button type="button" class="btn btn-outline-primary btn-sm" data-action="cos">cos</button>
                                        <button type="button" class="btn btn-outline-primary btn-sm" data-action="tan">tan</button>
                                    </div>
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-outline-primary btn-sm" data-action="log">log</button>
                                        <button type="button" class="btn btn-outline-primary btn-sm" data-action="ln">ln</button>
                                        <button type="button" class="btn btn-outline-primary btn-sm" data-action="sqrt">√</button>
                                    </div>
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-outline-primary btn-sm" data-action="power">x^y</button>
                                        <button type="button" class="btn btn-outline-primary btn-sm" data-action="pi">π</button>
                                        <button type="button" class="btn btn-outline-primary btn-sm" data-action="e">e</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="module-container" id="module-converter">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" data-i18n="unitConverter">单位转换器</h5>
                            <div class="converter-form">
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="category">类别</label>
                                    <select id="converterCategory" class="form-select">
                                        <option value="length" data-i18n="length">长度</option>
                                        <option value="area" data-i18n="area">面积</option>
                                        <option value="volume" data-i18n="volume">体积</option>
                                        <option value="weight" data-i18n="weight">重量</option>
                                        <option value="temperature" data-i18n="temperature">温度</option>
                                    </select>
                                </div>
                                <div class="row">
                                    <div class="col">
                                        <div class="mb-3">
                                            <label class="form-label" data-i18n="from">从</label>
                                            <input type="number" id="converterFrom" class="form-control">
                                            <select id="converterFromUnit" class="form-select mt-2"></select>
                                        </div>
                                    </div>
                                    <div class="col-auto d-flex align-items-center">
                                        <button type="button" class="btn btn-primary" id="swapUnits">
                                            <i class="bi bi-arrow-left-right"></i>
                                        </button>
                                    </div>
                                    <div class="col">
                                        <div class="mb-3">
                                            <label class="form-label" data-i18n="to">到</label>
                                            <input type="text" id="converterTo" class="form-control" readonly>
                                            <select id="converterToUnit" class="form-select mt-2"></select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="module-container" id="module-base">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" data-i18n="baseConverter">进制转换器</h5>
                            <div class="base-converter">
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="enterNumber">输入数字</label>
                                    <input type="text" id="baseInput" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="fromBase">原始进制</label>
                                    <select id="baseFrom" class="form-select">
                                        <option value="2" data-i18n="binary">二进制 (2)</option>
                                        <option value="8" data-i18n="octal">八进制 (8)</option>
                                        <option value="10" selected data-i18n="decimal">十进制 (10)</option>
                                        <option value="16" data-i18n="hexadecimal">十六进制 (16)</option>
                                    </select>
                                </div>
                                <div class="mb-3 text-center">
                                    <button type="button" class="btn btn-primary" id="convertBase">
                                        <i class="bi bi-arrow-down"></i> <span data-i18n="convert">转换</span>
                                    </button>
                                </div>
                                <div class="base-results">
                                    <div class="result-item">
                                        <span class="result-label" data-i18n="binaryLabel">二进制:</span>
                                        <span class="result-value" id="baseBin">0</span>
                                        <button class="btn btn-sm btn-copy" data-copy="baseBin"><i class="bi bi-clipboard"></i></button>
                                    </div>
                                    <div class="result-item">
                                        <span class="result-label" data-i18n="octalLabel">八进制:</span>
                                        <span class="result-value" id="baseOct">0</span>
                                        <button class="btn btn-sm btn-copy" data-copy="baseOct"><i class="bi bi-clipboard"></i></button>
                                    </div>
                                    <div class="result-item">
                                        <span class="result-label" data-i18n="decimalLabel">十进制:</span>
                                        <span class="result-value" id="baseDec">0</span>
                                        <button class="btn btn-sm btn-copy" data-copy="baseDec"><i class="bi bi-clipboard"></i></button>
                                    </div>
                                    <div class="result-item">
                                        <span class="result-label" data-i18n="hexadecimalLabel">十六进制:</span>
                                        <span class="result-value" id="baseHex">0</span>
                                        <button class="btn btn-sm btn-copy" data-copy="baseHex"><i class="bi bi-clipboard"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="module-container" id="module-percentage">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" data-i18n="percentageCalc">百分比计算器</h5>
                            <div class="percentage-calc">
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="calculateWhat">计算什么?</label>
                                    <select id="percentageType" class="form-select">
                                        <option value="of" data-i18n="whatIsXOfY">X是Y的百分之几?</option>
                                        <option value="is" data-i18n="XisWhatPercentOfY">X是Y的百分之几?</option>
                                        <option value="ofNumber" data-i18n="whatIsXPercentOfY">X%是Y的百分之几?</option>
                                        <option value="increase" data-i18n="increaseRate">增长率计算</option>
                                    </select>
                                </div>
                                <div class="row">
                                    <div class="col">
                                        <div class="mb-3">
                                            <label class="form-label" id="percentageLabel1">数值1</label>
                                            <input type="number" id="percentageVal1" class="form-control">
                                        </div>
                                    </div>
                                    <div class="col">
                                        <div class="mb-3">
                                            <label class="form-label" id="percentageLabel2">数值2</label>
                                            <input type="number" id="percentageVal2" class="form-control">
                                        </div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-primary" id="calculatePercentage">
                                    <span data-i18n="calculate">计算</span>
                                </button>
                                <div class="percentage-result mt-3">
                                    <div class="alert alert-success">
                                        <h4 id="percentageResult">0%</h4>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="module-container" id="module-fraction">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" data-i18n="fractionCalc">分数计算器</h5>
                            <div class="fraction-calc">
                                <div class="row">
                                    <div class="col">
                                        <div class="mb-3">
                                            <label class="form-label" data-i18n="numerator">分子</label>
                                            <input type="number" id="fractionNum1" class="form-control">
                                        </div>
                                    </div>
                                    <div class="col">
                                        <div class="mb-3">
                                            <label class="form-label" data-i18n="denominator">分母</label>
                                            <input type="number" id="fractionDen1" class="form-control">
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3 text-center">
                                    <select id="fractionOp" class="form-select w-auto d-inline-block">
                                        <option value="+">+</option>
                                        <option value="-">−</option>
                                        <option value="*">×</option>
                                        <option value="/">÷</option>
                                    </select>
                                </div>
                                <div class="row">
                                    <div class="col">
                                        <div class="mb-3">
                                            <label class="form-label">&nbsp;</label>
                                            <input type="number" id="fractionNum2" class="form-control">
                                        </div>
                                    </div>
                                    <div class="col">
                                        <div class="mb-3">
                                            <label class="form-label">&nbsp;</label>
                                            <input type="number" id="fractionDen2" class="form-control">
                                        </div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-primary" id="calculateFraction">
                                    <span data-i18n="calculate">计算</span>
                                </button>
                                <div class="fraction-result mt-3">
                                    <div class="alert alert-success">
                                        <h4 id="fractionResult">0</h4>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="module-container" id="module-equation">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" data-i18n="equationSolver">方程求解器</h5>
                            <div class="equation-solver">
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="equationType">方程类型</label>
                                    <select id="equationType" class="form-select">
                                        <option value="linear" data-i18n="linearEquation">一元一次方程</option>
                                        <option value="quadratic" data-i18n="quadraticEquation">一元二次方程</option>
                                        <option value="system" data-i18n="systemEquation">二元一次方程组</option>
                                    </select>
                                </div>
                                <div id="equationInputs"></div>
                                <button type="button" class="btn btn-primary" id="solveEquation">
                                    <span data-i18n="solve">求解</span>
                                </button>
                                <div class="equation-result mt-3">
                                    <div class="alert alert-success" id="equationResult"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="module-container" id="module-factorization">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" data-i18n="factorizationTool">因式分解工具</h5>
                            <div class="factorization-tool">
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="enterExpression">输入表达式</label>
                                    <input type="text" id="factorExpr" class="form-control" data-i18n="exprPlaceholder" placeholder="如: x^2 - 4">
                                </div>
                                <button type="button" class="btn btn-primary" id="factorizeBtn">
                                    <span data-i18n="factorize">因式分解</span>
                                </button>
                                <div class="factorization-result mt-3">
                                    <div class="alert alert-success" id="factorResult"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="module-container" id="module-polynomial">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" data-i18n="polynomialCalc">多项式运算</h5>
                            <div class="polynomial-calc">
                                <div class="row">
                                    <div class="col">
                                        <div class="mb-3">
                                            <label class="form-label" data-i18n="polynomial1">多项式1</label>
                                            <input type="text" id="poly1" class="form-control" data-i18n="poly1Placeholder" placeholder="如: x^2 + 2x + 1">
                                        </div>
                                    </div>
                                    <div class="col">
                                        <div class="mb-3">
                                            <label class="form-label" data-i18n="polynomial2">多项式2</label>
                                            <input type="text" id="poly2" class="form-control" data-i18n="poly2Placeholder" placeholder="如: x + 1">
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="operation">运算</label>
                                    <select id="polyOp" class="form-select">
                                        <option value="add" data-i18n="add">加</option>
                                        <option value="subtract" data-i18n="subtract">减</option>
                                        <option value="multiply" data-i18n="multiply">乘</option>
                                        <option value="divide" data-i18n="divide">除</option>
                                    </select>
                                </div>
                                <button type="button" class="btn btn-primary" id="calculatePolynomial">
                                    <span data-i18n="calculate">计算</span>
                                </button>
                                <div class="polynomial-result mt-3">
                                    <div class="alert alert-success" id="polyResult"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="module-container" id="module-function-plot">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" data-i18n="functionPlotter">函数绘图器</h5>
                            <div class="function-plotter">
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="enterFunction">输入函数 (y =)</label>
                                    <input type="text" id="functionInput" class="form-control" data-i18n="functionPlaceholder" placeholder="如: x^2, sin(x), exp(x)">
                                </div>
                                <button type="button" class="btn btn-primary" id="plotFunction">
                                    <span data-i18n="plot">绘图</span>
                                </button>
                                <button type="button" class="btn btn-secondary" id="clearPlot">
                                    <span data-i18n="clear">清除</span>
                                </button>
                                <div class="function-plot-container mt-3">
                                    <canvas id="functionCanvas" width="600" height="400"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="module-container" id="module-matrix">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" data-i18n="matrixCalc">矩阵计算器</h5>
                            <div class="matrix-calc">
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="matrixOperation">运算</label>
                                    <select id="matrixOp" class="form-select">
                                        <option value="add" data-i18n="add">加</option>
                                        <option value="subtract" data-i18n="subtract">减</option>
                                        <option value="multiply" data-i18n="multiply">乘</option>
                                        <option value="determinant" data-i18n="determinant">行列式</option>
                                        <option value="inverse" data-i18n="inverse">逆矩阵</option>
                                        <option value="transpose" data-i18n="transpose">转置</option>
                                    </select>
                                </div>
                                <div class="row">
                                    <div class="col">
                                        <label class="form-label" data-i18n="matrixA">矩阵 A</label>
                                        <textarea id="matrixA" class="form-control" rows="3" placeholder="1,2;3,4"></textarea>
                                    </div>
                                    <div class="col">
                                        <label class="form-label" data-i18n="matrixB">矩阵 B</label>
                                        <textarea id="matrixB" class="form-control" rows="3" placeholder="1,2;3,4"></textarea>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-primary mt-3" id="calculateMatrix">
                                    <span data-i18n="calculate">计算</span>
                                </button>
                                <div class="matrix-result mt-3">
                                    <div class="alert alert-success" id="matrixResult"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                        </div>
                    </div>
                </div>

                <div class="module-container" id="module-activity-logs">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h5 class="card-title" data-i18n="activityLogs">操作记录</h5>
                                <div>
                                    <button type="button" class="btn btn-sm btn-outline-primary" id="refreshLogs">
                                        <i class="bi bi-arrow-clockwise"></i> <span data-i18n="refresh">刷新</span>
                                    </button>
                                    
                                    <button type="button" class="btn btn-sm btn-outline-danger ms-2" id="clearLogs">
                                        <i class="bi bi-trash"></i> <span data-i18n="clear">清空</span>
                                    </button>
                                </div>
                            </div>
                            <div class="activity-stats mb-4">
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="card bg-light">
                                            <div class="card-body">
                                                <h6 data-i18n="totalActions">总操作次数</h6>
                                                <p class="h4" id="totalActions">0</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="card bg-light">
                                            <div class="card-body">
                                                <h6 data-i18n="mostUsedTool">最常用工具</h6>
                                                <p class="h4" id="mostUsedTool">-</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="card bg-light">
                                            <div class="card-body">
                                                <h6 data-i18n="recentActions">最近操作</h6>
                                                <p class="h4" id="recentActions">0</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="activity-filter mb-4">
                                <div class="row">
                                    <div class="col-md-6">
                                        <select class="form-select" id="toolFilter">
                                            <option value="all" data-i18n="allTools">所有工具</option>
                                            <option value="calculator-calc" data-i18n="calcScientific">科学计算器</option>
                                            <option value="calculator-percent" data-i18n="calcPercent">百分比计算</option>
                                            <option value="calculator-fraction" data-i18n="calcFraction">分数计算</option>
                                            <option value="converter-unit" data-i18n="convUnit">单位转换</option>
                                            <option value="converter-base" data-i18n="convBase">进制转换</option>
                                            <option value="algebra-equation" data-i18n="algEquation">方程求解</option>
                                            <option value="algebra-factor" data-i18n="algFactor">因式分解</option>
                                            <option value="algebra-poly" data-i18n="algPoly">多项式运算</option>
                                            <option value="algebra-plot" data-i18n="algPlot">函数绘图</option>
                                            <option value="algebra-matrix" data-i18n="algMatrix">矩阵运算</option>
                                            <option value="geometry-plane" data-i18n="geoPlane">平面几何</option>
                                            <option value="geometry-solid" data-i18n="geoSolid">立体几何</option>
                                            <option value="geometry-coord" data-i18n="geoCoord">坐标转换</option>
                                            <option value="statistics-data" data-i18n="statData">数据统计</option>
                                            <option value="statistics-prob" data-i18n="statProb">概率计算</option>
                                            <option value="statistics-chart" data-i18n="statChart">统计图表</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <select class="form-select" id="timeFilter">
                                            <option value="all" data-i18n="allTime">所有时间</option>
                                            <option value="24h" data-i18n="last24h">最近24小时</option>
                                            <option value="7d" data-i18n="last7d">最近7天</option>
                                            <option value="30d" data-i18n="last30d">最近30天</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="activity-logs-controls mb-4">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="d-flex align-items-center">
                                            <label class="form-label me-2" data-i18n="layout">布局:</label>
                                            <div class="btn-group" role="group">
